# KinectNavigator config -- OPTIONAL overrides.
#
# The DLL runs fine with no config file (defaults are compiled in). To tune,
# copy this to "kinectnav.ini" next to Kinect10.dll (or KinectNavigatorLab.exe /
# KinectNavigatorReplay.exe) and uncomment what you want. key = value, one per line.
# '#' or ';' starts a comment. Re-read on each launch.
#
# Units: distances = TORSO LENGTHS (shoulder-centre to hip-centre ~= 1.0),
#        speeds torso/second, *_ms milliseconds.
#
# THE RECOGNISER: an air d-pad centred on the dominant SHOULDER. Reach the arm out
# past the "park box" into a direction wedge -> that arrow key, hold -> auto-repeat.
# Bend the elbow / return to park to stop. A hanging arm sits in the straight-down
# dead wedge -> ignored. Left hand on the LEFT shoulder = command mode: reach
# up/right -> Enter, reach down/left -> Esc (slow repeat while held).
# (An older swipe-based model was removed in v1.1.)

# ---- general ----
# enable            = 1
# mirror            = 0         ; 1 = swap left/right output
# handedness        = right     ; right | left  (which arm drives)
# enable_confirm    = 1
# enable_back       = 1
# require_foreground = 1        ; only send keys while the game window is focused

# ---- air d-pad ----
# Clutch: starts DISARMED. Park your hand at the shoulder to arm it; it auto-disarms after the
# hand sits out of park, out of every wedge, AND lowered (below dpad_sleep_below_y) for
# dpad_disarm_ms.
# dpad_arm           = 1        ; 0 = always live (no clutch)
# dpad_arm_dwell_ms  = 350      ; hold the hand in the park box this long to arm (long enough that
#                               ;   an incidental brush past the shoulder doesn't wake it)
# dpad_arm_dwell_ms_ingame = 750 ; ...but while a song is playing, a firmer hold -- guards against
#                               ;   an accidental wake -> ESC mid-routine. Needs suppress_in_game = 1,
#                               ;   which is OFF by default (see "in a song" detection below)
# dpad_disarm_ms     = 500      ; ...hand idle out of play this long -> disarm ("ASLEEP")
# dpad_sleep_below_y = -0.35    ; ...but only while the hand is this far below the shoulder. A hand
#                               ;   raised in the dead gap between cones (aiming for UP / Confirm)
#                               ;   won't disarm -- only a lowered arm does.
# dpad_park_radius    = 0.32    ; |hand - dom shoulder| under this = parked / home / off
# dpad_park_exit_k    = 1.35    ; must reach park_radius * this to LEAVE park (hysteresis)
# dpad_up_reach_k     = 0.85    ; anisotropic park-exit, UP side only. <1 = UP must raise further
#                               ;   before it leaves park (less eager). 1.0 = symmetric / off.
# dpad_cross_reach_k  = 1.30    ; anisotropic park-exit, cross-body (LEFT) side only. >1 = LEFT
#                               ;   leaves park at a shorter reach (easier). 1.0 = symmetric / off.
# dpad_wedge_half_deg = 24      ; half-angle of the R/L/U wedges; the gaps between are dead
# dpad_down_min_drop  = 0.25    ; DOWN: hand at least this far below the shoulder ...
# dpad_down_min_out   = 0.30    ; ... AND this far out sideways (a hanging arm is ~0 -> ignored)
# dpad_entry_debounce = 3       ; frames in a wedge before the single NAV key press fires (snappy)
# dpad_repeat_dwell_ms = 600    ; then hold the wedge this long for nav auto-repeat to begin
# dpad_repeat_first_ms = 430    ; first repeat interval (nav), accelerates ...
# dpad_repeat_min_ms   = 200    ; ... down to this
# dpad_repeat_accel_ms = 22     ; each repeat shortens the interval by this
# dpad_wedge_grace_fr  = 4      ; tolerate this many frames of jitter into a dead gap
# dpad_cmd_gate_radius = 0.42   ; non-dom hand within this of the non-dom shoulder = command mode
#                               ;   (that hand is usually INFERRED there -- keep it generous)
# dpad_cmd_gate_exit_k = 1.5    ; once engaged, stays until the hand is radius*this away (hysteresis)
# dpad_cmd_dwell_ms    = 600    ; command mode: HOLD up/right this long before ENTER fires
# dpad_back_dwell_ms   = 1500   ; ...HOLD down/left this long before ESC fires (Esc is consequential)
# dpad_cmd_repeat_ms   = 700    ; command-mode (Enter/Esc) slow repeat interval
# dpad_handoff_grace_ms = 500   ; multiplayer: after control passes to a new driver, ignore
#                               ;   further hand-offs this long (anti-thrash between two players)
# trace             = 0        ; 1 = ~15 Hz signal dump to KinectNavigator.log
# overlay           = 0        ; on-screen HUD (state / d-pad / distance / action + 1 diag line).
#                              ;   OFF by default. Set to 1 for troubleshooting -- and run the
#                              ;   game windowed (config.xml FullScreen="0"), exclusive
#                              ;   fullscreen hides it.

# ---- "in a song" detection (via the game's file I/O) -- EXPERIMENTAL, OFF by default ----
# The idea: while a routine plays the game opens no maps\ bundles, so "no game-file open
# for a while + the game window up front" == in a song. It never mutes keys -- at most it
# swaps dpad_arm_dwell_ms -> dpad_arm_dwell_ms_ingame (the ESC guard above). The heuristic
# has NOT been confirmed to actually fire on this build, so it ships disabled.
# suppress_in_game      = 0     ; 1 = try the in-song ESC guard; 0 (default) = always dpad_arm_dwell_ms
# file_idle_gameplay_ms = 9000  ; no game file opens for this long (+ window up front) => "in a song"

# ---- misc ----
# arm_after_frames   = 12      ; ignore this many frames after a hand is (re)acquired while the filter settles

# ---- signal conditioning: dominant hand -> 1 Euro filtered position ----
# filter_1e_min_cutoff = 1.0    ; 1e f_cmin (Hz): lower = smoother when the hand is still
# filter_1e_beta       = 0.05   ; 1e speed coefficient: higher = less lag during a fast reach
# filter_1e_dcutoff    = 1.0    ; 1e derivative cutoff (Hz)

# ---- output keys (hex VK) ----
# key_left    = 0x25
# key_right   = 0x27
# key_up      = 0x26
# key_down    = 0x28
# key_confirm = 0x0D
# key_back    = 0x1B
# key_press_ms = 40
