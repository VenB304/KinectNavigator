# Skeleton Key config -- OPTIONAL overrides.
#
# The DLL runs fine with no config file at all (defaults are compiled in).
# To tune, copy this to "kinectnav.ini" next to Kinect10.dll in the game folder
# (or next to SkeletonKeyReplay.exe) and uncomment what you want to change.
# key = value, one per line. '#' or ';' starts a comment. Re-read on each launch.
#
# Units: fx/fy/distances are TORSO LENGTHS (shoulder-centre to hip-centre ~= 1.0).
#        velocities are torso-lengths/second. *_ms are milliseconds. *_frames at 30 Hz.
# Positions are body-relative: +fx = hand to the user's RIGHT, +fy = above the shoulders.

# ---- general ----
# enable             = 1        ; master on/off
# mirror             = 0        ; 1 = swap left/right (if the sensor image reads as a mirror)
# require_foreground  = 1        ; only send keys while the Legacy window is focused
# trace              = 0        ; 1 = ~15 Hz hand-signal dump to SkeletonKey.log (tuning only)

# ---- swipe detection ----
# swipe_velocity      = 1.6      ; min hand speed to begin a swipe
# swipe_vx_ceiling    = 8.0      ; faster than this = inferred-joint jitter, ignored
# swipe_distance      = 0.33     ; travel in the swipe direction needed to fire
# swipe_min_frames    = 3
# swipe_confirm_frames = 2       ; frames of one-way speed before the direction latches (anti-windup)

# ---- hold-to-repeat (swipe, then leave the hand out to that side) ----
# hold_enter_fx       = 0.60     ; hand still out past here after the post-swipe window -> hold
# hold_exit_fx        = 0.45     ; sustained (slow-smoothed) hand pulled back inside here -> stop
# hold_drop_fy        = -1.10    ; OR arm fully hanging below here -> stop
# hold_exit_frames    = 4        ; consecutive out-of-zone frames before a hold ends (jitter grace)
# first_repeat_ms     = 430      ; interval for the first auto-repeat
# min_repeat_ms       = 210      ; fastest it accelerates to
# repeat_accel_ms     = 22       ; each repeat shortens the interval by this
# post_swipe_ms       = 300      ; window after a swipe to decide single-step vs hold

# ---- re-arm (a wave satisfies this; no arms-at-sides needed between swipes) ----
# cooldown_ms         = 160      ; min settle before the next swipe can fire
# recenter_fx         = 0.40     ; |hand| back inside here -> re-armed
# rearm_timeout_ms    = 2500     ; no recenter this long -> fall back to the initial-arm pose

# ---- initial arm (first gesture, and after the sensor loses you) ----
# arm_center_fx       = 0.85     ; |hand| must be inside here (not parked out to a side)
# neutral_hold_ms     = 200
# arm_after_frames    = 15       ; ignore this many frames after a body is (re)acquired

# ---- smoothing ----
# smooth_fast         = 0.5      ; EMA alpha for motion
# smooth_slow         = 0.15     ; EMA alpha for the sustained-position / neutral tests

# ---- output keys (hex VK codes) ----
# key_left            = 0x25     ; VK_LEFT
# key_right           = 0x27     ; VK_RIGHT
# key_press_ms        = 40       ; key-down hold time per tap
