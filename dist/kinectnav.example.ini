# Skeleton Key config -- OPTIONAL overrides.
#
# The DLL runs fine with no config file (defaults are compiled in). To tune,
# copy this to "kinectnav.ini" next to Kinect10.dll (or SkeletonKeyLab.exe /
# SkeletonKeyReplay.exe) and uncomment what you want. key = value, one per line.
# '#' or ';' starts a comment. Re-read on each launch.
#
# Units: distances = TORSO LENGTHS (shoulder-centre to hip-centre ~= 1.0),
#        speeds torso/second, *_ms milliseconds.
#
# TWO RECOGNISERS -- pick with  nav_model :
#   extend (default) : an air d-pad centred on the dominant SHOULDER. Reach the arm
#                      out past the "park box" into a direction wedge -> that arrow key,
#                      hold -> auto-repeat. Bend the elbow / return to park to stop.
#                      A hanging arm sits in the straight-down dead wedge -> ignored.
#                      Left hand on the LEFT shoulder = command mode: reach up/right ->
#                      Enter, reach down/left -> Esc (slow repeat while held).
#   swipe            : the older motion model -- horizontal/vertical hand swipes,
#                      overhead-raise Confirm, arm-down-and-out Back.

# ---- general ----
# enable            = 1
# nav_model         = extend    ; extend | swipe
# mirror            = 0         ; 1 = swap left/right output
# handedness        = right     ; right | left  (which arm drives)
# enable_confirm    = 1
# enable_back       = 1
# require_foreground = 1        ; only send keys while the game window is focused

# ---- nav_model = extend : air d-pad ----
# Clutch: starts DISARMED. Park your hand at the shoulder to arm it; it auto-disarms after the
# hand sits out of park & out of every wedge (arm hanging / dancing) for dpad_disarm_ms.
# dpad_arm           = 1        ; 0 = always live (no clutch)
# dpad_arm_dwell_ms  = 200      ; hold the hand in the park box this long to arm
# dpad_disarm_ms     = 1500     ; ...hand idle out of play this long -> disarm ("ASLEEP")
# dpad_park_radius    = 0.32    ; |hand - dom shoulder| under this = parked / home / off
# dpad_park_exit_k    = 1.35    ; must reach park_radius * this to LEAVE park (hysteresis)
# dpad_wedge_half_deg = 24      ; half-angle of the R/L/U wedges; the gaps between are dead
# dpad_down_min_drop  = 0.25    ; DOWN: hand at least this far below the shoulder ...
# dpad_down_min_out   = 0.30    ; ... AND this far out sideways (a hanging arm is ~0 -> ignored)
# dpad_entry_debounce = 3       ; frames in a wedge before the single NAV key press fires (snappy)
# dpad_repeat_dwell_ms = 600    ; then hold the wedge this long for nav auto-repeat to begin
# dpad_repeat_first_ms = 430    ; first repeat interval (nav), accelerates ...
# dpad_repeat_min_ms   = 200    ; ... down to this
# dpad_repeat_accel_ms = 22     ; each repeat shortens the interval by this
# dpad_wedge_grace_fr  = 4      ; tolerate this many frames of jitter into a dead gap
# dpad_cmd_gate_radius = 0.42   ; non-dom hand within this of the non-dom shoulder = command mode
#                               ;   (that hand is usually INFERRED there -- keep it generous)
# dpad_cmd_gate_exit_k = 1.5    ; once engaged, stays until the hand is radius*this away (hysteresis)
# dpad_cmd_dwell_ms    = 600    ; command mode: HOLD up/right this long before ENTER fires
# dpad_back_dwell_ms   = 3000   ; ...HOLD down/left this long before ESC fires (Esc is consequential)
# dpad_cmd_repeat_ms   = 700    ; command-mode (Enter/Esc) slow repeat interval
# trace             = 0        ; 1 = ~15 Hz signal dump to SkeletonKey.log
# overlay           = 1        ; on-screen HUD (state / d-pad / distance / action + 1 diag line)
#                              ;   windowed mode only -- exclusive-fullscreen DirectX hides it

# ---- gameplay mute (via the game's file I/O) ----
# suppress_in_game     = 1     ; mute the recognizer during a song
# song_burst_count     = 4     ; opens of the same maps\<yr>\<song>_pc.ipk within song_burst_ms = "loading a song"
# song_burst_ms        = 2500
# file_idle_gameplay_ms = 6000  ; ...then no game file opens for this long => in the song
# gameplay_cap_ms      = 360000 ; failsafe un-mute

# ---- swipe detector (dominant hand -- runs on the 1 Euro + Savitzky-Golay signal) ----
# swipe_velocity     = 1.0      ; min hand speed to be swiping (SG stream; ~30-50% below the old EMA)
# swipe_vx_ceiling   = 16.0     ; loose sanity clamp (SG already kills single-frame spikes)
# swipe_peak_ratio   = 1.9      ; to fire, peak speed during the swipe must reach this * swipe_velocity
#                               ;   -- rejects a slow constant-velocity drift (arm lowering to rest
#                               ;   plateaus ~1.4 torso/s; a real stroke peaks 3-5). 1.0 disables it.
# swipe_distance     = 0.28     ; net travel (in the CURRENT segment) to fire
# swipe_min_frames   = 2        ; frames of one-way motion in the current segment before it fires
# swipe_max_segments = 4        ; the swipe is split at direction reversals -- a counter-flick
#                               ;   ("countersteer") then the real stroke are 2 segments and only the
#                               ;   last is judged (measured from the turnaround). More reversals than
#                               ;   this => fiddling, abort.
# swipe_max_active_frames = 24  ; a swipe that hasn't fired within this many frames aborts
# swipe_axis_ratio   = 1.4      ; dominant-axis speed must clearly beat the other axis
# swipe_cooldown_ms  = 500      ; after a swipe: no new swipe for this long (fixed blackout)
# swipe_settle_after_ms = 1200  ; ...and for this long after a swipe the hand must also come to
#                               ;   rest before the next one. The settle gate is enforced ONLY in
#                               ;   this window -- a cold swipe from rest is never gated (an
#                               ;   inferred hand's velocity noise made an always-on gate unusable).
# swipe_settle_frames = 3       ; settle = hand slow this many (leaky-counted) frames
# swipe_settle_frac  = 0.7      ; "slow" = both speeds under this * swipe_velocity
# swipe_y_min        = -0.95    ; a vertical swipe only fires while the hand is in this y band --
# swipe_y_max        =  1.10    ;   an arm dropping to hang passes below y_min and is not a DOWN
# swipe_vert_x_band  =  0.55    ; ...and only when the hand is roughly in front of the body

# ---- positional invariants (Stage 2): the stroke must END in the target zone ----
# A recovery / return-to-park stroke ends near neutral -> rejected here, no latency, no state.
# Torso units, from SHOULDER_CENTER; +y up, +x = user's right. The log prints
# "swipe X rejected -- ended out of zone (ex= ey= seg0=)" so these can be tuned in-game.
# up_end_min_y      =  0.15     ; a fired UP must end with the hand at least this high
# up_elbow_margin   =  0.05     ; ...and hand.y >= elbow.y - this (real forearm raise, not a
#                               ;   recovery drag). skipped when elbow not tracked. 9 = disable
# down_start_min_y  = -0.45     ; a fired DOWN's segment must START at/above this (lenient)
# down_end_max_y    = -0.40     ; ...and END at/below this (the real discriminator)
# left_end_max_x    = -0.10     ; a fired LEFT (dominant hand) must cross the midline to here
# right_end_min_x   =  0.35     ; a fired RIGHT must reach outward to here

# ---- Left/Right hold-to-repeat ----
# post_swipe_ms     = 400      ; window after an L/R swipe to catch the arm extend
# arm_extend_frac   = 0.90     ; |hand-shoulder| / (shoulder-elbow + elbow-hand) above this = "extended"
# arm_relax_frac    = 0.80     ; ...drops below this => stop repeating
# arm_level_tan_max = 1.0      ; repeat only while the arm is within this |dy|/|dx| of horizontal
#                              ;   (1.0 = +-45 deg). A straight arm held high or hanging low no
#                              ;   longer auto-repeats. Exit uses 1.4x this (hysteresis).
# repeat_first_ms   = 430      ; first auto-repeat interval
# repeat_min_ms     = 200      ; fastest it accelerates to
# repeat_accel_ms   = 22       ; each repeat shortens the interval by this

# ---- Confirm (dominant hand raised + still; auto-repeats while held) ----
# confirm_dwell_ms  = 1800
# confirm_repeat_ms = 550      ; once repeating, fire this often while the hand stays up. 0 = one-shot
# confirm_repeat_first_ms = 900 ; grace after the FIRST Confirm before the first repeat
# confirm_raise_fy  = 0.25     ; hand.y - SHOULDER_CENTER.y above this (torso) = "raised" (a deliberate high hold)
# confirm_still_vel = 0.50     ; and |hand velocity| under this (SG stream -- a held hand sits well under 0.3)

# ---- Back (non-dominant arm down-and-out ~45 deg; auto-repeats while held) ----
# back_dwell_ms     = 1800
# back_repeat_ms    = 550      ; once repeating, fire this often while the pose is held. 0 = one-shot
# back_repeat_first_ms = 900
# back_out_min      = 0.30     ; unit(hand - shoulder): sideways-away component at least this
# back_down_min     = 0.22     ; ...and downward component at least this
# back_down_max     = 0.88     ; ...but not straight down (a resting arm)
# back_still_vel    = 1.2

# ---- misc ----
# dwell_grace_frames = 20      ; Confirm/Back: consecutive bad frames tolerated before the timer resets
# arm_after_frames   = 12      ; ignore this many frames after a hand is (re)acquired
# smooth_fast        = 0.5     ; EMA -- NON-dominant hand only now (Back pose speed gate)
# smooth_slow        = 0.15

# ---- signal conditioning: dominant hand -> 1 Euro position + Savitzky-Golay velocity ----
# The whole swipe path runs on this now (Stage 1). SG peaks run ~30-50% below the old EMA
# central-diff, hence the lower swipe_velocity.
# filter_1e_min_cutoff = 1.0    ; 1e f_cmin (Hz): lower = smoother when the hand is still
# filter_1e_beta       = 0.05   ; 1e speed coefficient: higher = less lag during a fast stroke
# filter_1e_dcutoff    = 1.0    ; 1e derivative cutoff (Hz)

# ---- output keys (hex VK) ----
# key_left    = 0x25
# key_right   = 0x27
# key_up      = 0x26
# key_down    = 0x28
# key_confirm = 0x0D
# key_back    = 0x1B
# key_press_ms = 40
